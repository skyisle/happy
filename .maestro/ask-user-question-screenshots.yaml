appId: com.skyisle.happycoder
---
# AskUserQuestion Modal Screenshot Test
# Run: maestro test .maestro/ask-user-question-screenshots.yaml

# Navigate to Developer Tools
- launchApp:
    clearState: false

- tapOn: "Settings"
- scrollUntilVisible:
    element: "Developer Tools"
- tapOn: "Developer Tools"

# Navigate to AskUserQuestion demo
- scrollUntilVisible:
    element: "AskUserQuestion"
- tapOn: "AskUserQuestion"

# Wait for page to load
- assertVisible: "AskUserQuestion Demo"

# Screenshot 1: Single Select (Radio)
- tapOn:
    id: "btn-single-select"
- assertVisible: "Approach"
- assertVisible: "Which implementation approach would you prefer?"
- takeScreenshot: screenshots/ask-question-single-select

# Select an option
- tapOn: "Option B"
- takeScreenshot: screenshots/ask-question-single-select-selected

# Confirm
- tapOn: "Confirm"
- assertVisible: "Selected:"

# Screenshot 2: Multi Select (Checkbox)
- tapOn:
    id: "btn-multi-select"
- assertVisible: "Features"
- assertVisible: "Which features should be included?"
- takeScreenshot: screenshots/ask-question-multi-select

# Select multiple options
- tapOn: "Dark mode"
- tapOn: "Offline mode"
- takeScreenshot: screenshots/ask-question-multi-select-selected

# Confirm
- tapOn: "Confirm"
- assertVisible: "Selected:"

# Screenshot 3: Multiple Questions
- tapOn:
    id: "btn-multiple-questions"
- assertVisible: "Paradigm"
- takeScreenshot: screenshots/ask-question-multiple-questions

# Select options for both questions
- tapOn: "Functional"
- tapOn: "Jest"
- tapOn: "Vitest"
- takeScreenshot: screenshots/ask-question-multiple-selected

# Confirm
- tapOn: "Confirm"

# Screenshot 4: Maximum Questions (4)
- tapOn:
    id: "btn-max-questions"
- takeScreenshot: screenshots/ask-question-max-questions-top

# Scroll down in the modal to see more questions
- scroll:
    direction: DOWN
- takeScreenshot: screenshots/ask-question-max-questions-bottom

# Cancel this one
- tapOn: "Cancel"

# Screenshot 5: Korean Language Test
- tapOn:
    id: "btn-korean"
- assertVisible: "구현 방식"
- assertVisible: "어떤 방식으로 구현할까요?"
- takeScreenshot: screenshots/ask-question-korean

# Select and confirm
- tapOn: "옵션 A"
- tapOn: "Confirm"
- assertVisible: "선택됨:"

# Final screenshot showing result
- takeScreenshot: screenshots/ask-question-demo-final
